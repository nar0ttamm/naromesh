name: Generate Reel

# Schedule: Monday and Thursday at 10:00 AM IST (04:30 UTC)
on:
  schedule:
    - cron: "30 4 * * 1,4"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      mock_mode:
        description: "Run in MOCK_MODE (no real API calls)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run-pipeline:
    name: Run AI Reel Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js setup ───────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── Dependencies ────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── FFmpeg ──────────────────────────────────────────────────────────────
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      # ── Run pipeline ────────────────────────────────────────────────────────
      - name: Run pipeline
        run: npm run pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MOCK_MODE: ${{ github.event.inputs.mock_mode || 'false' }}
          # NODE_ENV must NOT be production for tsx to work
          NODE_ENV: development

      # ── Upload temp artifacts (for debugging) ───────────────────────────────
      - name: Upload temp artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-temp-${{ github.run_id }}
          path: temp/
          retention-days: 3
          if-no-files-found: ignore
